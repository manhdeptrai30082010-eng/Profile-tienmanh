<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiến Mạnh Metal</title>
    <style>
        :root {
            --primary: #d4af37;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-gray: #aaaaaa;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .card {
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--text-light);
        }
        .subtitle {
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 25px;
            font-style: italic;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 5px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            margin-top: 5px;
        }
        .switch-text {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-top: 15px;
        }
        .switch-text span {
            color: var(--primary);
            cursor: pointer;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #222;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .nav-item {
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-gray);
            padding: 5px 10px;
        }
        .nav-item.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }
        .music-box {
            background: #1a1a1a;
            border: 1px dashed var(--primary);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
        .post-card {
            background: #252525;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            margin-bottom: 15px;
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #444;
            object-fit: cover;
        }
        .post-author {
            font-weight: bold;
            font-size: 0.9rem;
        }
        .post-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-gray);
        }
        .action-btn {
            cursor: pointer;
        }
        .action-btn:hover {
            color: var(--primary);
        }
        .comment-section {
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        .comment-item {
            font-size: 0.8rem;
            margin-bottom: 5px;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 15px;
        }
        .admin-table th, .admin-table td {
            border: 1px solid #444;
            padding: 8px;
            text-align: left;
        }
        .btn-danger { background: #ff4d4d; color: white; padding: 3px 6px; font-size: 0.75rem; border-radius: 4px; width: auto; margin: 2px;}
        .btn-warning { background: #ffaa00; color: black; padding: 3px 6px; font-size: 0.75rem; border-radius: 4px; width: auto; margin: 2px;}
        .chat-box {
            height: 200px;
            background: #151515;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            text-align: left;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div id="welcome-header">
            <h1>Chào mừng bạn đến với Tiến Mạnh Metal</h1>
            <div class="subtitle">Sự sang trọng của bạn sẽ làm nổi bật</div>
        </div>
        <div class="music-box">
            🎵 <span>Trình phát nhạc nền</span>
            <input type="file" id="music-upload" accept="audio/mp3" style="display:none;" onchange="loadMusic(event)">
            <button class="btn-secondary" style="padding: 4px; font-size:0.75rem; width:auto; margin: 5px 0;" onclick="document.getElementById('music-upload').click()">Chèn nhạc MP3</button>
            <div style="margin-top: 5px;">
                <audio id="bg-audio" controls style="width:100%; height:30px; display:none;"></audio>
                <button id="btn-toggle-music" onclick="toggleMusic()" style="width:auto; padding:5px 10px; font-size:0.8rem;">Bật/Tắt Nhạc</button>
            </div>
        </div>
        <div id="screen-login" class="screen active">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="login-user" placeholder="Nhập tài khoản...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="login-pass" placeholder="Nhập mật khẩu...">
            </div>
            <button onclick="handleLogin()">Đăng Nhập</button>
            <div class="switch-text">Chưa có tài khoản? <span onclick="switchScreen('screen-register')">Đăng ký ngay</span></div>
        </div>
        <div id="screen-register" class="screen">
            <div class="form-group">
                <label>Tên đăng nhập mới</label>
                <input type="text" id="reg-user" placeholder="Tạo tài khoản...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="reg-pass" placeholder="Tạo mật khẩu...">
            </div>
            <div class="form-group">
                <label>Nhập lại mật khẩu</label>
                <input type="password" id="reg-pass-confirm" placeholder="Xác nhận mật khẩu...">
            </div>
            <button onclick="handleRegister()">Đăng Ký</button>
            <div class="switch-text">Đã có tài khoản? <span onclick="switchScreen('screen-login')">Đăng nhập</span></div>
        </div>
        <div id="screen-main" class="screen">
            <div class="nav-bar">
                <div class="nav-item active" id="nav-feeds" onclick="switchTab('feeds')">Bảng tin</div>
                <div class="nav-item" id="nav-chat" onclick="switchTab('chat')">Tin nhắn</div>
                <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">Hồ sơ</div>
                <div class="nav-item" id="nav-admin" onclick="switchTab('admin')" style="display:none; color:#ff4d4d;">Admin</div>
            </div>
            <div id="tab-feeds" class="tab-content">
                <div class="form-group">
                    <textarea id="post-content" rows="2" placeholder="Bạn đang nghĩ gì...?"></textarea>
                    <button onclick="createPost()" style="margin-top:5px; padding:8px;">Đăng bài</button>
                </div>
                <div id="feed-container"></div>
            </div>
            <div id="tab-chat" class="tab-content" style="display:none;">
                <div class="form-group">
                    <input type="text" id="search-friend" placeholder="Tìm người dùng để kết bạn..." oninput="searchUsers()">
                    <div id="search-results" style="margin-top:5px; font-size:0.85rem; text-align:left;"></div>
                </div>
                <div style="border-top: 1px solid #333; padding-top:10px;">
                    <label>Chọn bạn bè để nhắn tin:</label>
                    <select id="chat-target" onchange="loadMessages()"></select>
                    <div class="chat-box" id="chat-messages"></div>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="chat-input" placeholder="Nhập tin nhắn...">
