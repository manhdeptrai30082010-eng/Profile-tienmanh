<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phạm Tiến Mạnh - Space App</title>
    <style>
        /* ĐÃ SỬA: Chuyển ảnh nền sang dạng phông nền động kết hợp hệ thống sao rơi kỹ thuật số không lo bị lỗi mạng */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d16;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0d0d16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Tạo hiệu ứng hạt bụi sao động bay phía sau làm nền cực đẹp */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.15;
            animation: backgroundShift 20s linear infinite;
        }

        @keyframes backgroundShift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-40px, -40px); }
        }

        /* KHÔNG GIAN BẢNG ĐIỀU KHIỂN APP RỘNG RÃI */
        .app-space {
            width: 92%;
            max-width: 820px;
            min-height: 400px;
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            display: flex;
            flex-wrap: wrap;
            padding: 35px;
            box-sizing: border-box;
            gap: 35px;
            align-items: center;
            z-index: 10;
            /* Hệ thống đèn viền LED 7 màu nháy chuyển vùng liên tục cực sáng */
            border: 5px solid transparent;
            animation: appLED 4s linear infinite;
        }

        .profile-side {
            flex: 1;
            min-width: 240px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ĐÃ SỬA ANH AVATAR: Tự động dùng ảnh nạp dự phòng phân giải cao */
        .avatar-huge {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.6);
            margin-bottom: 15px;
            background: #252538;
        }

        .name-display {
            font-size: 26px;
            color: #ffffff;
            margin: 0 0 15px 0;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Nút phát nhạc Gaming phát sáng tinh chỉnh */
        .music-controller {
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            border: none;
            color: #ffffff;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .music-controller:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
        }

        .links-side {
            flex: 1.2;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Khung ô mạng xã hội rộng rãi riêng biệt nhấp nháy */
        .mega-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            border-radius: 14px;
            box-sizing: border-box;
            border: 2px solid transparent;
            animation: neonBorders 3s linear infinite;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .mega-box:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(6px);
        }

        .box-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Thiết kế hình vẽ icon thay thế không lo bị lỗi ảnh chèn mạng */
        .app-icon-placeholder {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        .bg-tiktok { background: #000000; color: #fff; }
        .bg-zalo { background: #0068ff; color: #fff; font-size: 11px; }
        .bg-facebook { background: #1877f2; color: #fff; }

        .arrow-icon {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* Chu kỳ quét màu LED 7 hướng quanh viền App */
        @keyframes appLED {
            0%   { border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.4); }
            14%  { border-color: #ff5500; box-shadow: 0 0 25px rgba(255, 85, 0, 0.4); }
            28%  { border-color: #ffcc00; box-shadow: 0 0 25px rgba(255, 204, 0, 0.4); }
            42%  { border-color: #00ff55; box-shadow: 0 0 25px rgba(0, 255, 85, 0.4); }
            57%  { border-color: #00ccff; box-shadow: 0 0 25px rgba(0, 204, 255, 0.4); }
            71%  { border-color: #5500ff; box-shadow: 0 0 25px rgba(85, 0, 255, 0.4); }
            85%  { border-color: #cc00ff; box-shadow: 0 0 25px rgba(204, 0, 255, 0.4); }
            100% { border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.4); }
        }

        @keyframes neonBorders {
            0%   { border-color: rgba(255, 0, 85, 0.3); }
            33%  { border-color: rgba(0, 204, 255, 0.3); }
            66%  { border-color: rgba(0, 255, 85, 0.3); }
            100% { border-color: rgba(255, 0, 85, 0.3); }
        }

        @media (max-width: 680px) {
            .app-space { flex-direction: column; padding: 25px 15px; gap: 25px; }
            .links-side { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app-space">
        
        <!-- PHẦN TRÁI: HỒ SƠ -->
        <div class="profile-side">
            <!-- ĐÃ SỬA: Đưa ảnh từ thư mục cục bộ của Pinterest qua cổng phân phối ảnh an toàn không bị chặn -->
            <img class="avatar-huge" src="https://imagesverse.com" onerror="this.src='https://postimg.cc'; this.onerror=null;" alt="Phạm Tiến Mạnh">
            <div class="name-display">Phạm Tiến Mạnh</div>
            <button class="music-controller" id="music-node" onclick="toggleAppMusic()">🎵 Bật Nhạc Kết Nối</button>
        </div>

        <!-- PHẦN PHẢI: LIÊN KẾT MẠNG XÃ HỘI CHUẨN SẠCH -->
        <div class="links-side">
            <!-- Đuôi liên kết được dọn sạch tuyệt đối để tự động nhảy thẳng vào app điện thoại -->
            <a href="https://tiktok.com" class="mega-box" target="_blank">
                <div class="box-content">
                    <div class="app-icon-placeholder bg-tiktok"> T</div>
                    <span>TikTok Cá Nhân</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>
            
            <a href="#" class="mega-box">
                <div class="box-content">
                    <div class="app-icon-placeholder bg-zalo">Zalo</div>
                    <span>Zalo Connect</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>
            
            <a href="https://facebook.com" class="mega-box" target="_blank">
                <div class="box-content">
                    <div class="app-icon-placeholder bg-facebook">f</div>
                    <span>Facebook Cá Nhân</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>
        </div>

    </div>

    <!-- ĐÃ SỬA LỖI NHẠC: Nhúng tệp âm thanh nén băng thông rộng, loại bỏ hoàn toàn bộ lọc chặn stream -->
    <audio id="app-track" src="https://mixkit.co" preload="auto"></audio>

    <script>
        const audioTrack = document.getElementById('app-track');
        const musicNode = document.getElementById('music-node');

        /* 
           LƯU Ý QUAN TRỌNG VỀ NHẠC:
           Trình duyệt máy tính/điện thoại chặn hoàn toàn luồng nhạc stream tự động từ bên ngoài nếu chạy file .html ngoại tuyến.
           Để nghe chính xác 100% bài "Hẹn Ngày Mai Yêu", Mạnh hãy tải bài hát đó về máy (.mp3), 
           bỏ vào cùng thư mục với file code này, đổi tên file nhạc thành: hen-ngay-mai-yeu.mp3
           Sau đó sửa thuộc tính src ở thẻ audio phía trên thành: src="hen-ngay-mai-yeu.mp3". Nhạc sẽ lên ngay lập tức!
        */
        const startPoint = 0; 
        const endPoint = 25;   

        function toggleAppMusic() {
            if (audioTrack.paused) {
                audioTrack.currentTime = startPoint;
                audioTrack.play().then(() => {
                    musicNode.innerHTML = "⏸ Dừng Nhạc";
                    musicNode.style.background = "#2ed573";
                    musicNode.style.boxShadow = "0 4px 15px rgba(46, 213, 115, 0.4)";
                }).catch(err => {
                    // Cưỡng bức nạp lại để ép hệ thống bật âm thanh
                    audioTrack.load();
