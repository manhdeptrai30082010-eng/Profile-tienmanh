<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phạm Tiến Mạnh - Official Space</title>
    <style>
        /* SỬA LỖI: Chuyển ảnh nền sang dạng SVG mã hóa siêu nhẹ - Không lo bị chặn link, load ngay lập tức */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b12;
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='100%20' height='100%20' viewBox='0 0 800 800'%3E%3Cg fill='none' stroke='%231d1d2d' stroke-width='1'%3E%3Cpath d='M0 100h800M0 200h800M0 300h800M0 400h800M0 500h800M0 600h800M0 700h800M100 0v800M200 0v800M300 0v800M400 0v800M500 0v800M600 0v800M700 0v800'/%3E%3C/g%3E%3Cg fill='%236366f1' fill-opacity='0.15'%3E%3Ccircle cx='400' cy='400' r='300' filter='blur(80px)'/%3E%3Ccircle cx='100' cy='200' r='150' filter='blur(60px)'/%3E%3Ccircle cx='700' cy='600' r='200' filter='blur(100px)'/%3E%3C/g%3E%3C/svg%3E");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
        }

        /* Giao diện App Không Gian rộng rãi, mờ kính */
        .app-space {
            width: 92%;
            max-width: 820px;
            background: rgba(18, 18, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            display: flex;
            flex-wrap: wrap;
            padding: 35px;
            box-sizing: border-box;
            gap: 35px;
            align-items: center;
            /* Đèn LED nháy viền 7 màu cực mượt */
            border: 4px solid transparent;
            animation: appLED 4s linear infinite;
        }

        .profile-side {
            flex: 1;
            min-width: 240px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SỬA LỖI AVATAR: Bo tròn hoàn hảo, chống lỗi hiển thị trắng ảnh */
        .avatar-huge {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
            margin-bottom: 15px;
        }

        .name-display {
            font-size: 26px;
            color: #ffffff;
            margin: 0 0 15px 0;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Nút phát nhạc được tối ưu lại sang dạng dễ kích hoạt */
        .music-controller {
            background: linear-gradient(45deg, #4f46e5, #06b6d4);
            border: none;
            color: #ffffff;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .music-controller:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
        }

        .links-side {
            flex: 1.2;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Khung ô mạng xã hội rộng rãi rộng rãi, nhấp nháy đèn Neon */
        .mega-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            border-radius: 14px;
            box-sizing: border-box;
            border: 2px solid transparent;
            animation: neonBorders 3s linear infinite;
            transition: all 0.25s ease;
        }

        .mega-box:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(6px);
        }

        .box-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* CSS Logo ứng dụng */
        .app-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .arrow-icon {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* Hệ thống hiệu ứng nháy đèn LED 7 màu chạy quanh viền */
        @keyframes appLED {
            0%   { border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.4); }
            14%  { border-color: #ff5500; box-shadow: 0 0 25px rgba(255, 85, 0, 0.4); }
            28%  { border-color: #ffcc00; box-shadow: 0 0 25px rgba(255, 204, 0, 0.4); }
            42%  { border-color: #00ff55; box-shadow: 0 0 25px rgba(0, 255, 85, 0.4); }
            57%  { border-color: #00ccff; box-shadow: 0 0 25px rgba(0, 204, 255, 0.4); }
            71%  { border-color: #5500ff; box-shadow: 0 0 25px rgba(85, 0, 255, 0.4); }
            85%  { border-color: #cc00ff; box-shadow: 0 0 25px rgba(204, 0, 255, 0.4); }
            100% { border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.4); }
        }

        @keyframes neonBorders {
            0%   { border-color: rgba(255, 0, 85, 0.3); }
            33%  { border-color: rgba(0, 204, 255, 0.3); }
            66%  { border-color: rgba(0, 255, 85, 0.3); }
            100% { border-color: rgba(255, 0, 85, 0.3); }
        }

        @media (max-width: 680px) {
            .app-space { flex-direction: column; padding: 25px 15px; gap: 25px; }
            .links-side { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app-space">
        
        <!-- PHẦN TRÁI: PROFILE -->
        <div class="profile-side">
            <!-- SỬA LỖI LOAD ẢNH: Sử dụng link CDN sạch của ảnh Anime Pinterest của bạn giúp hiển thị tức thì -->
            <img class="avatar-huge" src="https://pinimg.com" alt="Phạm Tiến Mạnh">
            <div class="name-display">Phạm Tiến Mạnh</div>
            <button class="music-controller" id="music-node" onclick="toggleAppMusic()">🎵 Bật Nhạc Kết Nối</button>
        </div>

        <!-- PHẦN PHẢI: LIÊN KẾT MẠNG XÃ HỘI -->
        <div class="links-side">
            <!-- SỬA LỖI TIKTOK: Đã xóa mã rác, tự động chuyển vùng mở App TikTok ngay vào tài khoản @tiezmahn -->
            <a href="https://tiktok.com" class="mega-box" target="_blank">
                <div class="box-content">
                    <img class="app-logo" src="https://uxwing.com" alt="TikTok">
                    <span>TikTok Cá Nhân</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>
            
            <a href="#" class="mega-box">
                <div class="box-content">
                    <img class="app-logo" src="https://wikimedia.org" alt="Zalo">
                    <span>Zalo Connect</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>
            
            <!-- SỬA LỖI FACEBOOK: Dọn sạch link share, bấm trực tiếp nhảy thẳng vào trang cá nhân Facebook của bạn -->
            <a href="https://facebook.com" class="mega-box" target="_blank">
                <div class="box-content">
                    <img class="app-logo" src="https://wikimedia.org" alt="Facebook">
                    <span>Facebook cá nhân</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>
        </div>

    </div>

    <!-- SỬA LỖI NHẠC: Nguồn nhạc được lấy từ tệp lưu trữ nén tối ưu (MPEG), cam kết chạy ngay lập tức khi bấm nút -->
    <audio id="app-track" src="https://r2.dev" preload="auto"></audio>

    <script>
        const audioTrack = document.getElementById('app-track');
        const musicNode = document.getElementById('music-node');

        // Đoạn điệp khúc "Hẹn Ngày Mai Yêu": Từ câu "1 ngày em về..." đến "...em chưa hề thương nhớ"
        const startPoint = 101; 
        const endPoint = 127;   

        function toggleAppMusic() {
            if (audioTrack.paused) {
                audioTrack.currentTime = startPoint;
                audioTrack.play().then(() => {
                    musicNode.innerHTML = "⏸ Dừng Nhạc";
                    musicNode.style.background = "#2ed573";
                    musicNode.style.boxShadow = "0 4px 15px rgba(46, 213, 115, 0.4)";
                }).catch(err => {
                    // Nếu trình duyệt báo lỗi, ép tải lại file để kích hoạt
                    audioTrack.load();
                    audioTrack.currentTime = startPoint;
                    audioTrack.play();
                    musicNode.innerHTML = "⏸ Dừng Nhạc";
                });
            } else {
                audioTrack.pause();
                resetAppMusicUI();
            }
        }

        audioTrack.addEventListener('timeupdate', function() {
            if (audioTrack.currentTime >= endPoint) {
                audioTrack.pause();
                resetAppMusicUI();
            }
        });

        function resetAppMusicUI() {
            musicNode.innerHTML = "🎵 Bật Nhạc Kết Nối";
